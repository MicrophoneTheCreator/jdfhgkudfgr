<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <title>Document</title>
    
</head>
<body>
  <div class="center-container">
    <h1 class="h1Looks">Cat photo App</h1>
    <img src="https://images6.alphacoders.com/337/337780.jpg" alt="Cute Cat">
    <p id="par">This is a cat photo website.</p>
    <div>
        <label class="form-check-label">
            <input type="checkbox" class="form-check-input" name="love" value="Love">
            Love
        </label>
        <label class="form-check-label">
            <input type="checkbox" class="form-check-input" name="cute" value="Cute">
            Cute
        </label>
        <label class="form-check-label">
            <input type="checkbox" class="form-check-input" name="silly" value="Silly">
            Silly
        </label>
    </div>
    <div>
        <form action="https://www.pexels.com/search/cat" method="get" target="_blank">
            <input type="text" placeholder="Type here what to search" class="text-input" name="q">
            <button type="submit" class="Search">Search</button>
        </form>
    </div>
</div>
</body>
</html>
